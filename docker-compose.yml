services:
  postgres:
    image: postgres:16-alpine
    container_name: assistance-postgres
    environment:
      POSTGRES_DB: assistance
      POSTGRES_USER: assistance
      POSTGRES_PASSWORD: assistance_dev
      TZ: America/Mexico_City
    ports:
      - "55432:5432"
    volumes:
      - assistance_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistance -d assistance"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Servicio de aplicación completo (backend con frontend embebido), solo se
  # levanta con `docker compose --profile full up`. El flujo de desarrollo
  # normal (`scripts/dev.sh`, Postgres solo) sigue funcionando sin cambios
  # con `docker compose up`.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assistance-app
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SERVER_PORT: "8080"
      MANAGEMENT_PORT: "8081"
      # DB_URL apunta al servicio postgres dentro de la red de compose
      # (puerto interno 5432, no el 55432 publicado al host).
      DB_URL: jdbc:postgresql://postgres:5432/assistance
      DB_MIGRATION_USER: assistance
      DB_MIGRATION_PASSWORD: assistance_dev
      DB_APP_USER: assistance_app
      DB_APP_PASSWORD: assistance_app_dev
      # Clave de cifrado de PII (CURP/RFC/NSS) — valor de ejemplo SOLO para
      # el perfil demo local; nunca reutilizar en staging/prod.
      APP_PII_KEY: ${APP_PII_KEY:-demo-only-32-byte-placeholder-key}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-demo-only-jwt-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  assistance_pgdata:
