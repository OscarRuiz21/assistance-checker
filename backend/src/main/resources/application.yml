spring:
  application:
    name: assistance-checker-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/assistance}
    username: ${DB_USER:assistance}
    password: ${DB_PASSWORD:assistance_dev}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.assistance: DEBUG
    org.hibernate.SQL: WARN

app:
  demo:
    universal-pin: "1234"
    auth-token: ${DEMO_TOKEN:demo123}
  cors:
    # Patrones permisivos para dev (LAN, ngrok, cloudflared, localhost en cualquier puerto).
    # En producción override con: export CORS_ORIGINS=https://admin.tudominio.com
    allowed-origins: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://10.*:*,https://*.ngrok-free.app,https://*.trycloudflare.com}
