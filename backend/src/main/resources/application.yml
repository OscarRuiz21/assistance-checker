spring:
  application:
    name: assistance-checker-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/assistance}
    username: ${DB_APP_USER:assistance_app}
    password: ${DB_APP_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    user: ${DB_MIGRATION_USER:assistance}
    password: ${DB_MIGRATION_PASSWORD:}
    placeholders:
      app_db_password: ${DB_APP_PASSWORD:}
      app_db_user: ${DB_APP_USER:assistance_app}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# Actuator real: con management.server.port distinto de server.port, Spring
# Boot mueve TODO actuator (incluido health) al puerto de management — nada
# de esto se sirve en el puerto público. info/metrics/prometheus/modulith
# solo se habilitan explícitamente en los perfiles local/demo, atados siempre
# al puerto de management.
#
# PublicHealthController (shared/internal/web) expone GET /actuator/health
# también en el puerto PÚBLICO delegando al HealthEndpoint real: lo necesita
# el health check del ALB/ECS (ver infra/modules/app/alb.tf, Fase 4), que
# golpea el puerto del contenedor, no el de management. SecurityConfig lo
# deja público (permitAll) igual que cualquier health check estándar.
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.assistance: INFO
    org.hibernate.SQL: WARN

app:
  pii:
    key: ${APP_PII_KEY:}
  auth:
    issuer-uri: ${AUTH_ISSUER_URI:}
    jwt-secret: ${APP_JWT_SECRET:}
  cors:
    # Sin defaults comodines en el perfil base: en prod se exige una lista
    # explícita de orígenes vía CORS_ORIGINS. Los patrones de LAN/ngrok para
    # desarrollo viven solo en application-local.yml / application-demo.yml.
    allowed-origins: ${CORS_ORIGINS:}
